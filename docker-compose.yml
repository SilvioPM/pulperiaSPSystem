services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spsystem
      POSTGRES_USER: spsystem
      POSTGRES_PASSWORD: spsystem123
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spsystem"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    # Sin puertos expuestos: todo el tráfico entra por HTTPS (servicio caddy).
    environment:
      # IMPORTANTE: Estos valores por defecto SOLO son para compatibilidad con instalaciones
      # ya existentes que NO han corrido preparar-existente.ps1.
      # Las instalaciones NUEVAS usan instalar.ps1 (genera secretos únicos en .env).
      # EL .env TIENE PRIORIDAD sobre estos valores.
      # PRODUCCIÓN: El .env DEBE existir con secretos únicos. Sin .env, el sistema no arranca seguro.
      DATABASE_URL: postgresql://spsystem:spsystem123@db:5432/spsystem
      JWT_SECRET: ${JWT_SECRET:-}
      APP_LICENSE_SECRET: ${APP_LICENSE_SECRET:-}
      NODE_ENV: production
      SPSYSTEM_DATA_DIR: /app/data
      SPSYSTEM_BACKUP_DIR: /app/respaldos
    volumes:
      - appdata:/app/data
      - ${RUTA_RESPALDOS:-./respaldos}:/app/respaldos
    depends_on:
      db:
        condition: service_healthy
    restart: always
    labels:
      - "app=spsystem"
      - "version=1.0"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - app
    restart: always
    labels:
      - "app=spsystem-proxy"

volumes:
  pgdata:
  appdata:
  caddydata: